name: Forge Frontend Production Smoke Test

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: forge-frontend-production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify Netlify production contains Forge Command
        shell: bash
        run: |
          set -euo pipefail
          SITE_URL="https://phantom-forge-command-center.netlify.app"
          success=0

          for attempt in $(seq 1 30); do
            echo "Attempt ${attempt}/30"
            code=$(curl -sS -L -o /tmp/index.html -w "%{http_code}" --max-time 20 "$SITE_URL" || true)
            if [ "$code" != "200" ]; then
              echo "Site returned HTTP ${code}; retrying..."
              sleep 10
              continue
            fi

            script=$(python - <<'PY'
          import re
          html=open('/tmp/index.html', encoding='utf-8').read()
          matches=re.findall(r'<script[^>]+src=["\']([^"\']+)["\']', html)
          print(matches[-1] if matches else '')
          PY
            )

            if [ -z "$script" ]; then
              echo "Could not locate Vite bundle; retrying..."
              sleep 10
              continue
            fi

            case "$script" in
              http*) bundle_url="$script" ;;
              /*) bundle_url="${SITE_URL}${script}" ;;
              *) bundle_url="${SITE_URL}/${script}" ;;
            esac

            bundle_code=$(curl -sS -L -o /tmp/app.js -w "%{http_code}" --max-time 30 "$bundle_url" || true)
            if [ "$bundle_code" != "200" ]; then
              echo "Bundle returned HTTP ${bundle_code}; retrying..."
              sleep 10
              continue
            fi

            if grep -Eq "FORGE EXECUTIVE|Forge Developer|Software Command" /tmp/app.js; then
              echo "Verified Forge Command production bundle at ${bundle_url}"
              success=1
              break
            fi

            echo "Production bundle is reachable but does not contain Forge Command yet; retrying..."
            sleep 10
          done

          if [ "$success" != "1" ]; then
            echo "Forge Command frontend did not become visible in production during the smoke-test window."
            exit 1
          fi
